name: Backend CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      # Service container for MySQL to allow tests to connect
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: stock_market_db_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Optimization: Install CPU-only PyTorch (saves ~3GB)
        pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
        pip install ruff pytest httpx
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Fix: Direct install of spacy model to avoid CLI 404s
        pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl

    - name: Lint with Ruff
      run: |
        # Run ruff (fast linter)
        # E501: Line too long (managed by formatter usually)
        # F401: Unused imports (init files often have these)
        ruff check . --ignore E501,F401,F841 || true 
        # Note: '|| true' allows lint warnings without failing build initially. 
        # Remove '|| true' strictly when ready to enforce.

    - name: Run Tests
      env:
        # Secrets injected from GitHub Actions
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
        # DB Config for Test Service
        MYSQL_HOST: 127.0.0.1
        MYSQL_USER: root
        MYSQL_PASSWORD: test_root_password
        MYSQL_DATABASE: stock_market_db_test
        TESTING: "true"
        PYTHONPATH: ${{ github.workspace }}/backend
        # Required for app startup in integration tests
        JWT_SECRET_KEY: "test_secret_key_for_pipeline_execution"
      run: |
        # Run All Standard Tests (Unit + Integration)
        echo "Running All Tests..."
        pytest tests/ -v
