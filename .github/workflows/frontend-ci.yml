name: Frontend CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Lint
      run: npm run lint

    - name: Build
      env:
        # Next.js build might require some env vars to not fail on static generation
        # Adding dummies if needed, otherwise standard build
        NEXT_PUBLIC_API_URL: http://localhost:8000
      run: npm run build
