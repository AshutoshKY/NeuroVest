name: Python Security (Bandit)

on:
  push:
    branches: [ "main", "infra/*" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        # Scans backend code for security issues (weak crypto, exec calls, etc.)
        # -r: recursive
        # -ll: log level (report only medium/high confidence)
        run: bandit -r backend/app -ll -c bandit.yaml
