frontend:
  - changed-files:
    - any-glob-to-any-file: 'frontend/**'

backend:
  - changed-files:
    - any-glob-to-any-file: 'backend/**'

docker:
  - changed-files:
    - any-glob-to-any-file: ['**/Dockerfile', 'docker-compose.yml', 'docker-*.yml']

docs:
  - changed-files:
    - any-glob-to-any-file: ['docs/**', '**/*.md']
    
ci:
  - changed-files:
    - any-glob-to-any-file: '.github/**'
