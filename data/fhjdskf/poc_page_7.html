<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>NeuroVest - Obsidian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #888;
            font-family: 'Inter', sans-serif;
        }

        .island {
            background: #111;
            border: 1px solid #333;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        .nav-item.active {
            background: #fff;
            color: #000;
        }

        .nav-item:hover:not(.active) {
            background: #222;
            color: #fff;
        }

        .fade {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="flex h-screen p-4 gap-4 overflow-hidden">

    <!-- FLOATING SIDEBAR -->
    <aside class="island w-16 md:w-64 rounded-3xl flex flex-col justify-between py-6 px-3 z-20">
        <div>
            <div class="flex items-center gap-3 px-3 mb-8">
                <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center text-black font-bold">N</div>
                <span class="hidden md:block font-semibold text-white">NeuroVest</span>
            </div>
            <nav class="space-y-1">
                <button onclick="go('dash')"
                    class="nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg> <span class="hidden md:block">Dash</span>
                </button>
                <button onclick="go('watch')"
                    class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg> <span class="hidden md:block">Watch</span>
                </button>
                <button onclick="go('set')"
                    class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg> <span class="hidden md:block">Settings</span>
                </button>
            </nav>
        </div>
        <div class="px-3">
            <div class="bg-gray-900 rounded-xl p-3 flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gray-700"></div>
                <div class="hidden md:block text-xs">
                    <div class="text-white">User</div>
                    <div>Pro Plan</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- FLOATING MAIN CONTENT -->
    <main class="island flex-1 rounded-3xl relative overflow-hidden flex flex-col">
        <!-- Page: Dashboard Landing -->
        <div id="pg-dash" class="flex-1 flex flex-col items-center justify-center p-8 fade">
            <div class="bg-gray-900 p-2 rounded-full mb-6 border border-gray-800 flex items-center gap-2 pr-4">
                <span class="bg-green-500 w-2 h-2 rounded-full ml-2"></span>
                <span class="text-xs text-white">Market Open</span>
            </div>
            <h1 class="text-5xl font-medium text-white mb-8 tracking-tight text-center">What are we trading?</h1>
            <input type="text"
                class="bg-black border border-gray-800 rounded-2xl p-4 w-full max-w-lg text-white text-center focus:border-white transition outline-none"
                placeholder="Search Ticker..." onkeydown="if(event.key === 'Enter') go('analysis')">
        </div>

        <!-- Page: Analysis -->
        <div id="pg-analysis" class="hidden flex-1 overflow-y-auto p-6 fade">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h1 class="text-3xl text-white font-semibold">Reliance Ind.</h1>
                    <div class="flex gap-2 mt-2">
                        <span class="bg-gray-900 text-white px-2 py-1 rounded text-xs border border-gray-800">NSE</span>
                        <span
                            class="bg-gray-900 text-white px-2 py-1 rounded text-xs border border-gray-800">Energy</span>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-4xl text-white tracking-tighter">₹1,556</div>
                    <div class="text-green-500">+2.47%</div>
                </div>
            </div>

            <!-- Big Chart -->
            <div class="w-full h-80 bg-gray-900 rounded-2xl mb-6 border border-gray-800 relative overflow-hidden">
                <svg class="absolute inset-0 w-full h-full" preserveAspectRatio="none">
                    <path d="M0,250 C100,240 300,300 800,50" fill="none" stroke="white" stroke-width="2" />
                    <path d="M0,250 C100,240 300,300 800,50 V320 H0 Z" fill="url(#grad)" opacity="0.2" />
                    <defs>
                        <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="white" />
                            <stop offset="1" stop-color="transparent" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <!-- Data Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white text-black rounded-2xl p-5">
                    <div class="text-xs font-bold uppercase mb-2">AI Signal</div>
                    <div class="text-3xl font-bold">BUY</div>
                    <div class="mt-2 text-xs opacity-70">85% Confidence</div>
                </div>
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
                    <div class="text-xs font-bold uppercase mb-2 text-white">RSI (14)</div>
                    <div class="text-3xl font-bold text-white">62.9</div>
                    <div class="mt-2 text-xs text-yellow-500">Neutral Zone</div>
                </div>
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
                    <div class="text-xs font-bold uppercase mb-2 text-white">Risk</div>
                    <div class="text-sm text-gray-300">Crude oil volatility may impact short term margins.</div>
                </div>
            </div>
        </div>

        <!-- Page: Settings -->
        <div id="pg-set" class="hidden flex-1 overflow-y-auto p-8 fade">
            <h1 class="text-3xl text-white font-semibold mb-8">Settings</h1>
            <div class="grid grid-cols-4 gap-8">
                <div class="col-span-1 space-y-2">
                    <button class="w-full text-left p-2 text-white bg-gray-800 rounded-lg">Profile</button>
                    <button class="w-full text-left p-2 hover:text-white">Security</button>
                    <button class="w-full text-left p-2 hover:text-white">Billing</button>
                </div>
                <div class="col-span-3 bg-gray-900 rounded-2xl p-6 border border-gray-800">
                    <h3 class="text-white font-bold mb-4">Profile Details</h3>
                    <div class="space-y-4">
                        <input type="text" value="Testing Demo"
                            class="w-full bg-black border border-gray-700 rounded-lg p-3 text-white">
                        <input type="text" value="demo@neurovest.com"
                            class="w-full bg-black border border-gray-700 rounded-lg p-3 text-white">
                        <button class="bg-white text-black px-4 py-2 rounded-lg font-bold">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function go(id) {
            document.getElementById('pg-dash').classList.add('hidden');
            document.getElementById('pg-analysis').classList.add('hidden');
            document.getElementById('pg-set').classList.add('hidden');

            if (id === 'dash') document.getElementById('pg-dash').classList.remove('hidden');
            if (id === 'analysis') document.getElementById('pg-analysis').classList.remove('hidden');
            if (id === 'set') document.getElementById('pg-set').classList.remove('hidden');

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active'); // Note: This assumes button click triggers it
        }
    </script>
</body>

</html>
